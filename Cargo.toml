[package]
name = "celltray"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Lightweight cross-platform peripheral battery diagnostics and tray utility"
default-run = "celltray"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
resvg = { version = "0.49.0", default-features = false }
sha2 = "0.11.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_Graphics_Dwm", "Win32_Networking_WinHttp", "Win32_System_Registry", "Win32_Storage_FileSystem"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["linux-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["macos-shared-device"] }
